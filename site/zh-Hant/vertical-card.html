隨意春芳歇，王孫自可留。</textarea><div class="vc-samples" role="group" aria-label="範例"><button class="vc-sample" type="button" data-text="空山新雨後，天氣晚來秋。

隨意春芳歇，王孫自可留。" data-sig="唐 · 王維" data-seal="摩詰">山居秋暝</button><button class="vc-sample" type="button" data-text="夜裡下過一場雨，早上的街道還是溼的。樓下早餐鋪的蒸籠冒著白氣，老闆照舊問一句「還是老樣子？」我點點頭，接過那袋豆漿和兩個包子，忽然覺得，日子就是這樣一點一點過下去的，不急，也不慢。" data-sig="十月 · 記" data-seal="日常">一段散文</button></div></div><div class="vc-pair"><div class="vc-field"><label class="vc-label" for="vc-sig">落款</label><input id="vc-sig" name="sig" type="text" lang="zh-Hant" value="唐 · 王維" spellcheck="false"></div><div class="vc-field"><label class="vc-label" for="vc-seal">印章（最多 4 字）</label><input id="vc-seal" name="seal" type="text" lang="zh-Hant" maxlength="4" value="摩詰" spellcheck="false"></div></div><fieldset class="vc-field"><legend class="vc-label">字型</legend><div class="presets n4"><label><input type="radio" name="font" value="serif-sc"><span>思源宋體 簡</span></label><label><input type="radio" name="font" value="serif-tc" checked><span>思源宋體 繁</span></label><label><input type="radio" name="font" value="hand"><span>霞鶩文楷</span></label><label><input type="radio" name="font" value="system"><span>系統字型</span></label></div></fieldset><fieldset class="vc-field"><legend class="vc-label">標點位置</legend><div class="presets n2"><label><input type="radio" name="punct" value="cn"><span>大陸 · 右上</span></label><label><input type="radio" name="punct" value="tw" checked><span>臺灣 · 置中</span></label></div></fieldset><label class="vc-check"><input type="checkbox" name="quotes" checked><span>彎引號改成直角引號「」『』</span></label><fieldset class="vc-field"><legend class="vc-label">紙張</legend><div class="presets n3"><label><input type="radio" name="paper" value="paper" checked><span>宣紙</span></label><label><input type="radio" name="paper" value="grid"><span>稿紙</span></label><label><input type="radio" name="paper" value="ink"><span>墨色</span></label></div></fieldset><fieldset class="vc-field"><legend class="vc-label">尺寸</legend><div class="presets n3"><label><input type="radio" name="size" value="34" checked><span>3:4</span></label><label><input type="radio" name="size" va
